name: Homu
options:
  bundleIdPrefix: jp.homu
  deploymentTarget: { iOS: "17.0" }
settings:
  base: { SWIFT_VERSION: 5.0 }
targets:
  Homu:
    type: application
    platform: iOS
    sources: [{ path: Homu, excludes: [Resources] }]
    resources: [{ path: Homu/Resources }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.homu.legal3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 法務3級
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    scheme: { testTargets: [HomuTests] }
  HomuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HomuTests]
    dependencies: [{ target: Homu }]

